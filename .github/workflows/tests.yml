name: Tests

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q app tests
      - run: ruff check app tests --select E9,F63,F7,F82
      - run: python -m pip install pip-audit detect-secrets
      # The project itself is a local editable package, so remove only that
      # package before auditing the third-party environment. Reinstall it
      # immediately afterward for the application/self-test/test gates.
      - run: python -m pip uninstall -y linkedin-automation
      - run: python -m pip install --upgrade "setuptools>=83"
      - run: pip-audit --strict
      - run: detect-secrets scan --all-files
      - run: pip install -e ".[dev]"
      - run: python -m app selftest
      - run: pytest -q -m "not e2e"

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q -m e2e --tracing=retain-on-failure
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
