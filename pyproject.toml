[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-automation"
version = "0.1.0"
description = "Local-first LinkedIn workflow assistant with Playwright and approval gates"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.55,<2",
  "python-dotenv>=1.0,<2",
  "typer>=0.16,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
linkedin-agent = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
